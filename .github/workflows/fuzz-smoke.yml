# Bounded fuzz smoke: a short libFuzzer burst over each untrusted-input
# parser (yEnc, NZB, PAR2, RAR, zip, media containers). This is NOT a full
# campaign - long campaigns run offline - just enough to catch a change
# that makes a parser panic/OOB/hang on the seed corpus plus fresh
# mutations. A crash fails the job and uploads the reproducing input.
#
# Runs on BOTH repos, which it did not until 4 Aug. It was gated to the
# public repo and triggered on pull_request only, and the public repo has
# had two PRs ever - so eleven fuzz targets had never once run in CI, on
# either side, while all the actual work lands as direct pushes here. That
# is the gap the 4 Aug scorecard round found.
#
# Scheduled rather than per-push on purpose: a burst is ~11 minutes of
# fuzzing plus a build, which is too much to pay on every commit for a
# check that is looking for a slow-moving class of bug. Nightly at 05:00
# UTC, four hours clear of nightly.yml's 09:00 so the two are not
# competing for runners.
name: fuzz-smoke
on:
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # PR number when there is one, ref otherwise - without the fallback every
  # scheduled run shares one empty group key and cancels the last.
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  # Superseding a PR push is right; killing a half-finished nightly burst
  # because a dispatch fired is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: nightly toolchain
        run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - name: cache cargo (+ cargo-fuzz binary + fuzz target dir)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/nzbkit/fuzz/target
          key: fuzz-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: install cargo-fuzz
        # No-op (exit 0) when the cached binary already matches.
        run: cargo install cargo-fuzz --locked
      - name: seed corpora from in-tree fixtures
        working-directory: crates/nzbkit/fuzz
        run: |
          mkdir -p corpus/rar_extract corpus/par2_parse corpus/mkv_parse corpus/zip_parse
          mkdir -p corpus/rar_map corpus/rar_recovery_scan
          cp ../../../vendor/rars/tests/fixtures/rar*/*.rar corpus/rar_extract/ 2>/dev/null || true
          cp ../tests/fixtures/par2/*.par2 corpus/par2_parse/ 2>/dev/null || true
          cp ../tests/fixtures/mkv/*.mkv corpus/mkv_parse/ 2>/dev/null || true
          cp ../tests/fixtures/zip/*.zip corpus/zip_parse/ 2>/dev/null || true
          cp ../../../vendor/rars/tests/fixtures/rar*/*.rar corpus/rar_recovery_scan/ 2>/dev/null || true
          # rar_map reads byte 0 as a feed-shape selector, so every seed
          # carries one: 0x09 = whole-file spans WITH a password, which is
          # what reaches the encrypted paths. Without the prefix each seed
          # would lose its signature byte to the selector and parse as junk.
          i=0
          for f in ../testdata/rar4/*.rar ../testdata/rar5/*.rar \
                   ../../../vendor/rars/tests/fixtures/rar*/*.rar; do
            [ -f "$f" ] || continue
            { printf '\011'; cat "$f"; } > "corpus/rar_map/seed-$i.bin"
            i=$((i+1))
          done
      - name: fuzz burst (60s per target)
        working-directory: crates/nzbkit/fuzz
        run: |
          set -e
          # All eleven targets. mediaprobe and zip_stream landed 2 Aug, after
          # this list was last touched on 31 Jul, and were simply never added
          # - not an exclusion. Both want covering: zip_stream is the chase's
          # call order over an in-memory source, and mediaprobe runs over a
          # file still arriving off Usenet, before PAR2 has verified anything.
          for t in yenc_decode nzb_parse nzblnk_parse par2_parse rar_extract \
                   rar_map rar_recovery_scan mkv_parse zip_parse zip_stream \
                   mediaprobe; do
            echo "::group::fuzz $t"
            cargo +nightly fuzz run "$t" -- \
              -max_total_time=60 -rss_limit_mb=4096 -timeout=10
            echo "::endgroup::"
          done
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: crates/nzbkit/fuzz/artifacts/
          if-no-files-found: ignore
