[package]
name = "nzbkit"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Engine library for nzbfast: NZB parsing, yEnc codec, NNTP pool, scheduler"

[build-dependencies]
cc = "1"

[dependencies]
memchr = "2"
quick-xml = "0.41"
thiserror = "2"
crc32fast = "1"
libc = "0.2"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# User-definable categories: the one rule-matching engine (regex, falling
# back to keyword substring) shared with the daemon's Smart Folders.
regex-lite = "0.1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1"
# Already in the tree as rustls' crypto provider; named directly so
# `bench-cpu` can measure the TLS AEAD with the SAME implementation the
# download path uses. Every downloaded byte is decrypted, so on a weak
# core that term belongs in the per-byte budget next to md5 and decode.
aws-lc-rs = "1.17"
rusqlite = { version = "0.40.1", features = ["bundled", "functions"] }
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
flate2 = "1"
# RAR5 encrypted store-mode sets: AES-256-CBC + PBKDF2-HMAC-SHA256
# (RustCrypto - pure Rust, no new C in the tree).
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
sha2 = "0.10"
# Nested one-pass phase 2: the chasing decompressor drives the vendored
# RAR engine's streaming reader over still-arriving inner volumes.
rars = { path = "../../vendor/rars" }
# Nested one-pass phase 3: inner 7z archives parse + decode in-stream
# through a blocking Read+Seek view of the arriving bytes.
sevenz-rust2 = { version = "0.21", default-features = false, features = ["aes256", "bzip2", "ppmd"] }

# PAR2 hashes every downloaded byte through MD5; the asm backend is
# ~25% faster than the portable soft path - a slow-x86 win (docker
# amd64, old desktops). md5-asm has a compile_error! on Windows (both
# MSVC and mingw) and md-5 falls back to soft off-x86, hence the gate.
[target.'cfg(all(target_arch = "x86_64", not(target_os = "windows")))'.dependencies]
md-5 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
rand = "0.8"
# 7z test fixtures are written in-process (the writer needs the encoder
# half of the crate; release builds keep it off).
sevenz-rust2 = { version = "0.21", default-features = false, features = ["aes256", "bzip2", "ppmd", "compress"] }
# test-util: paused-clock tests (the connect-timeout regression test
# auto-advances past CONNECT_TIMEOUT instead of sleeping 20 s for real).
tokio = { version = "1", features = ["test-util"] }
