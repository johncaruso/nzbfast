<?xml version="1.0" encoding="UTF-8"?>
<!-- nzbfast app icon, SMALL art (16, 24 and 32 px). Bolt alone: at 16 px the
     slipstream lines and the bolt compete for the same few pixels and the
     mark turns to noise. Both .ico and .icns store one image per size, so
     this is a normal split rather than a compromise. See icon.svg for the
     128 px and up art, which shares this bolt.

     The bolt is our own geometry, traced off a reference render: each edge
     was least-squares fitted from the reference's pixels and the vertices
     taken as the intersections of those lines, so the silhouette is exact
     rather than eyeballed. Nothing here is downscaled raster - the whole
     point of the split is that small sizes stay crisp.

     Two things are deliberate and easy to undo by accident:
       * Every corner is blunted with a short quadratic through the vertex.
         A bare acute point - especially the bottom tip - renders as a
         vanishing needle once it is 16 px tall.
       * The waist (the bar joining the two arms) is ~150 units, about
         2.3 px at 16 px, so the middle can never break.
     Flat #fff fill only: a gradient or a stroke on the bolt would blur the
     edge that is carrying the whole mark at this size. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tileg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa8ff"/>
      <stop offset="1" stop-color="#6d47e6"/>
    </linearGradient>
  </defs>
  <rect x="60" y="60" width="904" height="904" rx="196" fill="url(#tileg)"/>
  <path d="M 432.7 179.9 Q 447.9 149.5 481.9 149.5 L 713.2 149.5 Q 747.2 149.5 727.7 177.3
           L 576.4 394 Q 556.9 421.8 590.9 421.8 L 742.3 421.8 Q 790.3 421.8 754.6 453.9
           L 329.4 836.1 Q 272.9 886.9 307.4 819.2 L 427.7 583.3 Q 443.1 553 409.1 553
           L 290.2 553 Q 246.2 553 265.9 513.6 Z" fill="#fff"/>
</svg>
