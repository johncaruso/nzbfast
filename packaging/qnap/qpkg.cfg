# QDK build configuration for the QNAP package. Read by qbuild at build
# time and by qinstall.sh on the NAS; make-qpkg.sh substitutes the two
# @@ placeholders before either sees it.
#
# ONE package for every model, like the Synology .spk next door: the data
# lives in shared/ (which QDK installs on any architecture) rather than in
# the per-arch x86_64/ and arm_64/ directories, so qbuild emits a single
# architecture-less .qpkg carrying both binaries. QDK would otherwise
# build one file per architecture and the App Center's Install Manually
# dialog does no filtering, which makes "which of these two is my NAS"
# a question the downloader has to answer correctly before anything can
# work. The cost is one unused binary in the download; nzbfast-setup.sh
# deletes it during install so it does not sit on disk forever.
#
# The flip side of an architecture-less package is that QDK's own
# wrong-platform guard is not generated, so package_routines has to
# refuse the 32-bit ARM models itself.

QPKG_NAME="nzbfast"
QPKG_DISPLAY_NAME="nzbfast"
QPKG_VER="@@VERSION@@"
QPKG_AUTHOR="nzbfast"
QPKG_LICENSE="GPL-3.0-or-later"
QPKG_SUMMARY="Fast Usenet (NZB) downloader with a web dashboard and a SABnzbd- and NZBGet-compatible API. PAR2 repair and RAR extraction are native."

# Start late and stop early: nzbfast wants its volumes mounted and the
# network up, and nothing else on the NAS waits for it.
QPKG_RC_NUM="101"
QPKG_SERVICE_PROGRAM="nzbfast.sh"

# App Center's Open button, and the port it opens. Both are read out of
# /etc/config/qpkg.conf by QTS and nzbfast cannot rewrite either, which is
# why the daemon is started with NZBFAST_PORT_LOCKED=1 - see nzbfast.sh.
QPKG_WEBUI="/"
QPKG_WEB_PORT="@@PORT@@"
QPKG_SERVICE_PORT="@@PORT@@"
QPKG_SERVICE_PIDFILE="/var/run/nzbfast.pid"

# Deliberately NOT set: QPKG_CONFIG. It looks like the field that protects
# a user's settings across an upgrade, and it is the opposite. qinstall's
# store_config() compares the md5 of each listed file against the copy
# SHIPPED IN THE PACKAGE; settings.json is written by the daemon at run
# time and is in no package, so the shipped checksum is empty, the "no
# original" branch is taken, and the user's live file is renamed to
# settings.json.qdkorig on the first upgrade. Settings survive an upgrade
# here because they live outside the package directory entirely and
# nothing in the package ever writes them (see nzbfast-setup.sh).

# 4.3.0 is where QTS's own App Center behaviour settles down (volume
# selection, the Open button). The binaries themselves are static musl and
# care about nothing older.
QTS_MINI_VERSION="4.3.0"

# 1 = let the user install to a volume of their choosing. A multi-volume
# NAS usually has one big volume for media, and the App Center's picker is
# a dialog QNAP owners already know. nzbfast-setup.sh then prefers a
# download share on whichever volume they picked.
QPKG_VOLUME_SELECT="1"

# Starting takes as long as binding the port and reading the config;
# stopping has to let an in-flight job finish writing. 30/60 seconds.
QPKG_TIMEOUT="30,60"
